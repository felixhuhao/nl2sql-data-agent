tables:
  dim_date:
    display_name: 日期维表
    description: 日期、周、月、季度、年份维度
    domain: time
  dim_users:
    display_name: 用户维表
    description: 用户基础属性和注册信息
    domain: user
  dim_products:
    display_name: 商品维表
    description: 商品品类、品牌和价格信息
    domain: product
  dim_regions:
    display_name: 区域维表
    description: 省份、城市和大区信息
    domain: region
  dim_channels:
    display_name: 渠道维表
    description: 订单来源渠道信息
    domain: channel
  fact_orders:
    display_name: 订单事实表
    description: 订单支付金额、折扣和状态
    domain: sales
  fact_order_items:
    display_name: 订单明细事实表
    description: 订单商品明细、数量和明细金额
    domain: sales

columns:
  date_key: 日期键，格式 YYYYMMDD
  date_value: 日期
  year: 年份
  quarter: 季度
  month: 月份
  week: 周序号
  day_of_week: 星期
  user_key: 用户代理键
  user_id: 用户业务 ID
  name: 名称
  gender: 性别
  age_group: 年龄段
  register_date: 注册日期
  city: 城市
  product_key: 商品代理键
  product_id: 商品业务 ID
  category: 一级品类
  sub_category: 二级品类
  brand: 品牌
  price: 标价
  region_key: 区域代理键
  province: 省份
  region_group: 大区
  channel_key: 渠道代理键
  channel_name: 渠道名称
  channel_type: 渠道类型
  order_id: 订单 ID
  total_amount: 订单原始金额
  discount_amount: 订单优惠金额
  payment_amount: 订单实付金额，销售额口径字段
  order_status: 订单状态；取值含义：paid=已支付，completed=已完成，refunded=已退款/退款
  item_id: 订单明细 ID
  quantity: 商品数量
  unit_price: 成交单价
  item_amount: 明细金额

table_columns:
  dim_users:
    name: 用户姓名
    city: 用户所在城市
  dim_products:
    name: 商品名称
  dim_regions:
    city: 城市

dimension_columns:
  - date_key
  - date_value
  - year
  - quarter
  - month
  - week
  - day_of_week
  - user_key
  - user_id
  - gender
  - age_group
  - register_date
  - city
  - product_key
  - product_id
  - category
  - sub_category
  - brand
  - region_key
  - province
  - region_group
  - channel_key
  - channel_name
  - channel_type
  - order_id
  - order_status
  - item_id

metric_columns:
  - price
  - total_amount
  - discount_amount
  - payment_amount
  - quantity
  - unit_price
  - item_amount

sample_value_fallbacks:
  gender:
    - 女
    - 男
  age_group:
    - 18-24
    - 25-34
    - 35-44
    - 45+
  category:
    - 手机数码
    - 家用电器
    - 服饰鞋包
    - 食品生鲜
    - 美妆个护
  region_group:
    - 华东
    - 华北
    - 华南
    - 西南
    - 华中
  channel_name:
    - 官网
    - 天猫
    - 京东
    - 抖音
    - 小程序
  channel_type:
    - 自营
    - 平台
    - 内容电商
  order_status:
    - paid
    - completed
    - refunded

confirmed_relationships:
  - source_table: fact_orders
    source_column: user_key
    target_table: dim_users
    target_column: user_key
    relationship_type: many_to_one
    description: 订单关联用户
  - source_table: fact_orders
    source_column: region_key
    target_table: dim_regions
    target_column: region_key
    relationship_type: many_to_one
    description: 订单关联区域
  - source_table: fact_orders
    source_column: channel_key
    target_table: dim_channels
    target_column: channel_key
    relationship_type: many_to_one
    description: 订单关联渠道
  - source_table: fact_orders
    source_column: date_key
    target_table: dim_date
    target_column: date_key
    relationship_type: many_to_one
    description: 订单关联日期
  - source_table: fact_order_items
    source_column: order_id
    target_table: fact_orders
    target_column: order_id
    relationship_type: many_to_one
    description: 明细关联订单
  - source_table: fact_order_items
    source_column: product_key
    target_table: dim_products
    target_column: product_key
    relationship_type: many_to_one
    description: 明细关联商品
  - source_table: fact_order_items
    source_column: date_key
    target_table: dim_date
    target_column: date_key
    relationship_type: many_to_one
    description: 明细关联日期
