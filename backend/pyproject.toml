[project]
name = "nl2sql-data-agent-backend"
version = "0.1.0"
description = "Backend for the NL2SQL data agent."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "sqlglot>=25.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
