  - id: user_repeat_purchase_rate
    type: normal
    question: 最近30天复购率
    tags: [user, complex]
    provider: mock
    mock_sql: >-
      SELECT CAST(COUNT(DISTINCT CASE WHEN second_order.order_id IS NOT NULL THEN o.user_key END) AS DOUBLE)
        / COUNT(DISTINCT o.user_key) AS repeat_purchase_rate
      FROM fact_orders o
      JOIN dim_date d ON o.date_key = d.date_key
      LEFT JOIN fact_orders second_order
        ON o.user_key = second_order.user_key
        AND o.order_id <> second_order.order_id
      LEFT JOIN dim_date second_date ON second_order.date_key = second_date.date_key
      WHERE d.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31'
        AND (second_date.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31' OR second_date.date_value IS NULL)
    expected:
      should_execute: true
      matched_query_id: null
      required_tables: [fact_orders, dim_date]
      required_columns:
        - fact_orders.user_key
        - fact_orders.order_id
      result_columns: [repeat_purchase_rate]
      min_row_count: 1
      chart_type: table
      join_paths:
