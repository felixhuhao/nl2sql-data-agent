  - id: payment_distribution
    type: normal
    question: 订单金额分布
    tags: [sales, distribution, complex]
    provider: mock
    mock_sql: >-
      SELECT
        CASE
          WHEN o.payment_amount < 100 THEN '0-100'
          WHEN o.payment_amount < 500 THEN '100-500'
          WHEN o.payment_amount < 1000 THEN '500-1000'
          ELSE '1000+'
        END AS payment_bucket,
        COUNT(*) AS order_count
      FROM fact_orders o
      JOIN dim_date d ON o.date_key = d.date_key
      WHERE d.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31'
      GROUP BY payment_bucket
      ORDER BY MIN(o.payment_amount)
    expected:
      should_execute: true
      matched_query_id: null
      required_tables: [fact_orders, dim_date]
      required_columns:
        - fact_orders.payment_amount
      result_columns: [payment_bucket, order_count]
