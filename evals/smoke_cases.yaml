  - id: top_category_by_region
    type: normal
    question: 各地区最畅销品类
    tags: [region, category, complex]
    provider: mock
    mock_sql: >-
      SELECT r.region_group, p.category, SUM(i.item_amount) AS sales_amount
      FROM fact_order_items i
      JOIN fact_orders o ON i.order_id = o.order_id
      JOIN dim_regions r ON o.region_key = r.region_key
      JOIN dim_products p ON i.product_key = p.product_key
      JOIN dim_date d ON i.date_key = d.date_key
      WHERE d.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31'
      GROUP BY r.region_group, p.category
      QUALIFY ROW_NUMBER() OVER (PARTITION BY r.region_group ORDER BY SUM(i.item_amount) DESC) = 1
      ORDER BY SUM(i.item_amount) DESC
    expected:
      should_execute: true
      matched_query_id: null
      required_tables: [fact_order_items, fact_orders, dim_regions, dim_products, dim_date]
