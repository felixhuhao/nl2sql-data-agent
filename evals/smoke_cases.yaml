  - id: recent_7d_vs_30d_sales
    type: normal
    question: 最近7天与30天销售额对比
    tags: [sales, comparison, complex]
    provider: mock
    mock_sql: >-
      SELECT
        SUM(CASE WHEN d.date_value BETWEEN DATE '2025-12-25' AND DATE '2025-12-31' THEN o.payment_amount ELSE 0 END) AS recent_7d_sales,
        SUM(CASE WHEN d.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31' THEN o.payment_amount ELSE 0 END) AS recent_30d_sales
      FROM fact_orders o
      JOIN dim_date d ON o.date_key = d.date_key
      WHERE d.date_value BETWEEN DATE '2025-12-02' AND DATE '2025-12-31'
    expected:
      should_execute: true
      matched_query_id: null
      required_tables: [fact_orders, dim_date]
      required_columns:
        - fact_orders.payment_amount
        - dim_date.date_value
      result_columns: [recent_7d_sales, recent_30d_sales]
      min_row_count: 1
      chart_type: table
