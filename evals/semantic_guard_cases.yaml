        - order_status (VARCHAR) [dimension] - 订单状态；取值含义：paid=已支付，cancelled=已取消/取消
        - date_key (INTEGER) [dimension] - 日期键
      ## Guidance
      - Value-derived rates over documented order_status values are allowed.
    expected:
      required_concepts:
