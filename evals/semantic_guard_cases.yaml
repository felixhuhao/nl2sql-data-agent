  - id: verifier_supported_return_rate
    type: verifier_only
    question: 查看退货率趋势
    tags: [verifier_only, positive_schema, return]
    promotion_pattern: concept_absent_full_metadata
    full_schema_context: |-
      # Schema Context
      ## Tables
      - fact_orders: 订单事实表
        - order_id (VARCHAR) [dimension] - 订单 ID
        - order_status (VARCHAR) [dimension] - 订单状态；取值含义：paid=已支付，returned=已退货/退货
        - date_key (INTEGER) [dimension] - 日期键
      ## Guidance
      - Value-derived rates over documented order_status values are allowed.
    expected:
      required_concepts:
        - concept: 退货率
          supported: true

