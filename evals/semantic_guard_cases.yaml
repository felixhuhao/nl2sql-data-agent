    tags: [verifier_only, positive_schema, deletion]
    promotion_pattern: concept_absent_full_metadata
    full_schema_context: |-
      # Schema Context
      ## Tables
      - fact_orders: 订单事实表
        - order_id (VARCHAR) [dimension] - 订单 ID
        - is_deleted (BOOLEAN) [dimension] - 是否删除订单；true=已删除，false=未删除
        - deleted_at (TIMESTAMP) [dimension] - 删除时间，非空表示订单已删除
    expected:
      required_concepts:
        - concept: 删除的订单
          supported: true

