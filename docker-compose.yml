services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: ecommerce
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      DUCKDB_PATH: /app/data/ecommerce.duckdb
      SQLITE_PATH: /app/data/metadata.sqlite
      DATASET_CURRENT_DATE: "2025-12-31"
      LLM_PROVIDER: auto
      VECTOR_ENABLED: auto
      HF_HOME: /app/model-cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/model-cache/sentence-transformers
      TORCH_HOME: /app/model-cache/torch
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_PREFIX: nl2sql
      DEFAULT_DATASOURCE: duckdb_ecommerce
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DATABASE: ecommerce
      CLICKHOUSE_READONLY: "true"
      CLICKHOUSE_MAX_EXECUTION_TIME: "30"
      CLICKHOUSE_MAX_RESULT_ROWS: "10000"
    volumes:
      - app_data:/app/data
      - model_cache:/app/model-cache
    depends_on:
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_data:
  clickhouse_data:
  model_cache:
  qdrant_data:
